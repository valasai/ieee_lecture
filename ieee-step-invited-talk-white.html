    position: absolute; inset: 0; backface-visibility: hidden;

  button.pair, button.copy, button.reset { font-size: 24px; padding: 0 22px; }
  button.tool { font-size: 28px; }
  #poll-controls button { font-size: 20px; padding: 8px 14px; }
  button.dot.on, button.sem.on { background: var(--amber); color: #1a1204; }

  .action { margin-top: 12px; color: var(--teal); font-weight: 800; font-size: clamp(28px, 2.2vw, 44px); }

  .slide.on .in { animation: rise .45s ease both; animation-delay: calc(var(--i, 0) * 70ms); }

    .flip.flipped .back { transform: none; position: relative; }

/* Poll */
const pollBox = document.getElementById("poll");
let counts = DATA.pollOptions.map(() => 0);
try { const saved = JSON.parse(localStorage.getItem(DATA.pollKey) || "null"); if (Array.isArray(saved) && saved.length === 3) counts = saved.map(Number); } catch (e) {}
function savePoll() { try { localStorage.setItem(DATA.pollKey, JSON.stringify(counts)); } catch (e) {} }
function roomLine() {
  return "This room said: " + DATA.pollOptions.map((n, i) => n + " " + counts[i]).join(", ");
}
function drawPoll() {
  if (!pollBox) return;
  pollBox.innerHTML = "";
  const max = Math.max(1, ...counts);
  DATA.pollOptions.forEach((name, i) => {
    const col = document.createElement("button");
    col.type = "button";
    col.className = "col c" + i;
    col.innerHTML = "<b></b><span class=\"track\"><i></i></span><em></em>";
    col.querySelector("b").textContent = counts[i];
    col.querySelector("i").style.height = (counts[i] / max * 100) + "%";
    col.querySelector("em").textContent = name;
    col.addEventListener("click", () => { counts[i] += 1; savePoll(); drawPoll(); paintRoom(); drawPollControls(); });
    pollBox.appendChild(col);
  });
}
function drawPollControls() {
  const host = document.getElementById("poll-controls");
  host.innerHTML = "";
  DATA.pollOptions.forEach((name, i) => {
    const minus = document.createElement("button");
    minus.type = "button"; minus.className = "tap"; minus.textContent = "− " + name;
    minus.addEventListener("click", () => { counts[i] = Math.max(0, counts[i] - 1); savePoll(); drawPoll(); paintRoom(); drawPollControls(); });
    const plus = document.createElement("button");
    plus.type = "button"; plus.className = "tap"; plus.textContent = "+ " + name;
    plus.addEventListener("click", () => { counts[i] += 1; savePoll(); drawPoll(); paintRoom(); drawPollControls(); });
    host.appendChild(minus);
    host.appendChild(plus);
  });
  const reset = document.createElement("button");
  reset.type = "button"; reset.className = "reset"; reset.textContent = "Reset";
  reset.addEventListener("click", () => { counts = [0, 0, 0]; savePoll(); drawPoll(); paintRoom(); drawPollControls(); });
  host.appendChild(reset);
}
function paintRoom() { const n = document.getElementById("room-said"); if (n) n.textContent = roomLine(); }
drawPoll(); paintRoom(); drawPollControls();
document.getElementById("poll-reset").onclick = () => { counts = [0, 0, 0]; savePoll(); drawPoll(); paintRoom(); drawPollControls(); };

/* Map */
const MAP_W = 620, MAP_H = 300;

function arcPath(a, b) {
  const midLat = (a.lat + b.lat) / 2 + 8;
  const midLon = (a.lon + b.lon) / 2;
  const [x1, y1] = project(a.lat, a.lon, MAP_W, MAP_H);
  const [x2, y2] = project(b.lat, b.lon, MAP_W, MAP_H);
  const [cx, cy] = project(midLat, midLon, MAP_W, MAP_H);
  return "M" + x1 + " " + y1 + " Q" + cx + " " + cy + " " + x2 + " " + y2;
}

/* Count-up stats */
document.querySelectorAll("button.stat").forEach((btn) => {
  const label = btn.textContent;
  btn.addEventListener("click", () => {
    const from = Number(btn.dataset.from || 0);
    const to = Number(btn.dataset.to);
    const suffix = btn.dataset.suffix || "";
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / 700);
      btn.textContent = Math.round(from + (to - from) * t) + suffix;
      if (t < 1) requestAnimationFrame(frame);
      else setTimeout(() => { btn.textContent = label; }, 800);
    }
    requestAnimationFrame(frame);
  });
});

/* Navigation */
let i = 0;

  i = (n + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle("on", k === i));

  bar.style.width = ((i + 1) / slides.length * 100) + "%";

/* Presenter keys */
let timerMode = 0, elapsed = 0, last = 0, rafId = 0;
const timer = document.getElementById("timer");
function paintTimer() {
  const sec = Math.floor(elapsed / 1000);
  timer.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  timer.classList.toggle("red", sec >= 30 * 60);
  timer.classList.toggle("amber", sec >= 25 * 60 && sec < 30 * 60);
}
function tick(now) {
  if (timerMode !== 1) return;
  elapsed += now - last; last = now; paintTimer();
  rafId = requestAnimationFrame(tick);
}
function onTimerKey() {
  if (timerMode === 0) { timerMode = 1; timer.classList.add("show"); last = performance.now(); rafId = requestAnimationFrame(tick); }
  else if (timerMode === 1) { timerMode = 2; cancelAnimationFrame(rafId); }
  else { timerMode = 0; elapsed = 0; timer.classList.remove("show", "amber", "red"); paintTimer(); }
}
document.getElementById("full").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  if (e.key === "Escape") overview.classList.remove("open");
  if (e.key === "n" || e.key === "N") { notes.classList.toggle("open"); document.body.classList.toggle("notes-open"); }
  if (e.key === "f" || e.key === "F") document.getElementById("full").click();
  if (e.key === "t" || e.key === "T") onTimerKey();
});

let x0 = null, y0 = null;
deck.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a, input, .flip")) { x0 = null; return; }
  x0 = e.clientX; y0 = e.clientY;
});
window.addEventListener("pointerup", (e) => {
  if (x0 == null) return;
  const dx = e.clientX - x0, dy = e.clientY - y0;
  if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? i + 1 : i - 1);
  x0 = null;
});

go(0);
